name: ojas_healing
description: "Ojas Healing — Spiritual wellness app by Ajay Swami"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.4

  # Auth Providers
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3

  # Video
  youtube_player_flutter: ^9.1.1
  video_player: ^2.9.3
  chewie: ^1.8.5

  # Audio
  just_audio: ^0.9.43
  just_audio_background: ^0.0.1-beta.11
  audio_session: ^0.1.21

  # Payments
  razorpay_flutter: ^1.3.9

  # UI / Theming
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  lottie: ^3.3.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  gap: ^3.0.1

  # Charts
  fl_chart: ^0.70.2

  # Offline Storage
  hive_flutter: ^1.1.0
  flutter_cache_manager: ^3.4.1

  # Networking
  dio: ^5.8.0+1
  http: ^1.3.2

  # PDF / Files
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.5
  open_file: ^3.5.8
  file_picker: ^8.3.7

  # Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Permissions
  permission_handler: ^11.3.1

  # Device / Platform
  device_info_plus: ^11.2.0
  package_info_plus: ^8.3.0
  connectivity_plus: ^6.1.3

  # Internationalization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Data Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  uuid: ^4.5.1

  # Utilities
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  in_app_review: ^2.0.9
  app_links: ^6.3.4
  webview_flutter: ^4.10.0

  # Live Video (100ms)
  hmssdk_flutter: ^1.10.5

  # AI Agent — Voice I/O
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.9.2
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter:
  uses-material-design: true
  generate: true
  # assets and fonts sections to be added after files are placed in:
  #   assets/images/  assets/icons/  assets/lottie/
  #   assets/fonts/   assets/audio/samples/
